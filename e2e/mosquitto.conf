# Parley e2e broker config (docs/testing.md layer 3). Secretless and stateless by design: Parley
# never holds credentials, and no parley topic is ever retained (protocol.md §2). persistence off
# means no cross-run message redelivery — each matrix pair starts from a clean broker.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type warning
log_type error
connection_messages false
