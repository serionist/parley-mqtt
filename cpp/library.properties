name=ParleyMqtt
version=1.0.0
author=The Parley Authors
maintainer=The Parley Authors
sentence=MQTT RPC: call a typed command on another device and get one typed result back.
paragraph=Parley is request/response (request-reply) over MQTT. Statically allocated, no exceptions or RTTI, tick-driven from loop(): a commander + handler protocol core over a consumer-supplied MQTT transport adapter and an ArduinoJson codec, with progress streaming, real cancellation and liveness heartbeats that tell "nobody answered" apart from "went silent mid-command". Needs only MQTT 3.1.1. One of four parallel reference implementations of the Parley v1 wire protocol (C++, C#, Python, JS/TS).
category=Communication
url=https://github.com/serionist/parley-mqtt
architectures=*
includes=Parley.h
depends=ArduinoJson (=7.4.3)
