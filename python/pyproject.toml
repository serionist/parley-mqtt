[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

# Distribution name is `parley-mqtt` (the bare `parley` name on PyPI is an unrelated project);
# the import package stays `parley`. Version is lockstep across all four ecosystems
# (bump-version.sh keeps the five manifests in step) — keep `version = "…"` on one line.
[project]
name = "parley-mqtt"
version = "1.0.1"
description = "Request/response RPC over MQTT (MQTT RPC / request-reply): typed commands with progress, cancellation, liveness heartbeats and at-most-once delivery. The Python (asyncio) reference implementation of Parley protocol v1."
requires-python = ">=3.10"
readme = "README.md"
# PEP 639: SPDX license expression + license files. Do NOT also carry a `License ::` classifier —
# the two are mutually exclusive under Metadata 2.4 and modern build/publish tooling rejects the combo.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "mqtt",
  "rpc",
  "mqtt-rpc",
  "request-response",
  "request-reply",
  "remote-procedure-call",
  "iot",
  "protocol",
  "messaging",
  "esp32",
  "asyncio",
  "parley",
]
authors = [{ name = "The Parley Authors" }]
# Every entry below is verified against `trove_classifiers.sorted_classifiers` by the gate-pack job
# in .github/workflows/ci.yml; `python -m build` (hatchling) is what actually rejects a bad one.
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Communications",
  "Topic :: Home Automation",
  "Topic :: Internet",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# Zero required runtime dependencies in core — bring your own MQTT client via a transport adapter.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
  "mypy==2.3.0",
]

[project.urls]
Homepage = "https://github.com/serionist/parley-mqtt"
Repository = "https://github.com/serionist/parley-mqtt"
Issues = "https://github.com/serionist/parley-mqtt/issues"
Documentation = "https://github.com/serionist/parley-mqtt/blob/main/docs/protocol.md"
Changelog = "https://github.com/serionist/parley-mqtt/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/parley"]

[tool.hatch.build.targets.sdist]
include = ["src/parley", "tests", "README.md", "LICENSE"]

# --- Ruff (format + lint) ---
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
# The formatter owns code line width; long docstrings/comments stay readable (E501 off).
# RUF002/RUF003 flag intentional typography (en dashes, §, arrows) in docstrings/comments that
# mirror the protocol spec's prose — kept for readability.
ignore = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private members deliberately (bounded-state / re-entrancy inspection) and use
# broad excepts to prove containment.
"tests/**" = ["B017", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["parley"]

# --- mypy (strict) ---
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

# --- pytest / pytest-asyncio ---
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = [
  "error",
  "error:coroutine .* was never awaited:RuntimeWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
